<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1830"/>
      <stop offset="60%" style="stop-color:#0f0e17"/>
      <stop offset="100%" style="stop-color:#1a1228"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c8a96e"/>
      <stop offset="100%" style="stop-color:#e8c98e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c6fcd"/>
      <stop offset="100%" style="stop-color:#9d8fe0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Orb blurs -->
    <radialGradient id="orb1" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:rgba(120,80,220,0.35)"/>
      <stop offset="100%" style="stop-color:rgba(120,80,220,0)"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:rgba(40,100,240,0.2)"/>
      <stop offset="100%" style="stop-color:rgba(40,100,240,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient orbs -->
  <ellipse cx="200" cy="200" rx="380" ry="320" fill="url(#orb1)" opacity="0.6"/>
  <ellipse cx="1050" cy="480" rx="340" ry="280" fill="url(#orb2)" opacity="0.5"/>

  <!-- Left side: Mock slide preview -->
  <rect x="60" y="80" width="480" height="300" rx="16" fill="rgba(255,255,255,0.04)" stroke="rgba(124,111,205,0.3)" stroke-width="1.5"/>

  <!-- Slide content: title line (gold/current) -->
  <rect x="96" y="128" width="3" height="32" rx="1.5" fill="url(#gold)"/>
  <rect x="108" y="133" width="260" height="10" rx="5" fill="url(#gold)" opacity="0.9"/>
  <text x="108" y="143" font-family="Georgia, serif" font-size="11" fill="rgba(200,169,110,0.6)" letter-spacing="1">SLIDE TITLE</text>

  <!-- Revealed lines -->
  <rect x="108" y="168" width="340" height="8" rx="4" fill="rgba(255,255,255,0.75)"/>
  <rect x="108" y="188" width="300" height="8" rx="4" fill="rgba(255,255,255,0.75)"/>

  <!-- Bullet lines -->
  <circle cx="120" cy="220" r="3" fill="url(#gold)"/>
  <rect x="132" y="216" width="260" height="8" rx="4" fill="rgba(255,255,255,0.65)"/>
  <circle cx="120" cy="244" r="3" fill="url(#gold)"/>
  <rect x="132" y="240" width="220" height="8" rx="4" fill="rgba(255,255,255,0.65)"/>

  <!-- Hidden lines (not yet revealed) -->
  <rect x="108" y="270" width="280" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>
  <rect x="108" y="292" width="200" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>
  <rect x="108" y="314" width="240" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>

  <!-- Nav bar hint -->
  <rect x="60" y="396" width="480" height="48" rx="0" fill="rgba(0,0,0,0.4)"/>
  <rect x="180" y="410" width="220" height="4" rx="2" fill="rgba(200,169,110,0.4)"/>
  <rect x="80" y="408" width="48" height="22" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="104" y="423" font-family="sans-serif" font-size="14" fill="rgba(255,255,255,0.5)" text-anchor="middle">←</text>
  <rect x="148" y="408" width="48" height="22" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="172" y="423" font-family="sans-serif" font-size="14" fill="rgba(255,255,255,0.5)" text-anchor="middle">→</text>

  <!-- Slide counter badge -->
  <rect x="455" y="96" width="68" height="24" rx="12" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="489" y="112" font-family="DM Sans, sans-serif" font-size="10" fill="rgba(255,255,255,0.85)" text-anchor="middle" font-weight="600" letter-spacing="1">2 / 8</text>

  <!-- Right side: Branding & description -->
  <!-- Logo mark -->
  <rect x="620" y="88" width="56" height="56" rx="14" fill="rgba(124,111,205,0.15)" stroke="rgba(124,111,205,0.4)" stroke-width="1.5"/>
  <rect x="632" y="104" width="3" height="24" rx="1.5" fill="url(#gold)"/>
  <rect x="642" y="109" width="22" height="5" rx="2.5" fill="url(#gold)" opacity="0.9"/>
  <rect x="642" y="118" width="18" height="4" rx="2" fill="rgba(255,255,255,0.6)"/>
  <rect x="642" y="126" width="20" height="4" rx="2" fill="rgba(255,255,255,0.6)"/>

  <!-- App name -->
  <text x="692" y="124" font-family="Georgia, serif" font-size="38" font-weight="700" fill="white" letter-spacing="-0.5">Trainer</text>
  <text x="880" y="124" font-family="Georgia, serif" font-size="38" font-weight="700" fill="url(#gold)" letter-spacing="-0.5">Deck</text>

  <!-- Tagline -->
  <text x="620" y="178" font-family="DM Sans, sans-serif" font-size="18" fill="rgba(255,255,255,0.55)" letter-spacing="0.5">Present smarter. One line at a time.</text>

  <!-- Divider -->
  <rect x="620" y="200" width="520" height="1" fill="rgba(255,255,255,0.08)"/>

  <!-- Feature bullets -->
  <circle cx="632" cy="236" r="4" fill="url(#gold)"/>
  <text x="648" y="241" font-family="DM Sans, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)">Line-by-line reveal — keep your audience focused</text>

  <circle cx="632" cy="272" r="4" fill="url(#gold)"/>
  <text x="648" y="277" font-family="DM Sans, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)">Upload .md · .txt · PDF · Images</text>

  <circle cx="632" cy="308" r="4" fill="url(#gold)"/>
  <text x="648" y="313" font-family="DM Sans, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)">Works on any device — offline capable</text>

  <circle cx="632" cy="344" r="4" fill="url(#gold)"/>
  <text x="648" y="349" font-family="DM Sans, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)">Navigate back to recap, resume where you left</text>

  <circle cx="632" cy="380" r="4" fill="url(#gold)"/>
  <text x="648" y="385" font-family="DM Sans, sans-serif" font-size="16" fill="rgba(255,255,255,0.8)">Install as PWA — no App Store required</text>

  <!-- Divider -->
  <rect x="620" y="408" width="520" height="1" fill="rgba(255,255,255,0.08)"/>

  <!-- URL + PWA badge -->
  <text x="620" y="438" font-family="DM Sans, sans-serif" font-size="15" fill="rgba(200,169,110,0.8)" letter-spacing="0.3">trainerdeck.vercel.app</text>
  <rect x="900" y="420" width="80" height="26" rx="13" fill="rgba(124,111,205,0.2)" stroke="rgba(124,111,205,0.4)" stroke-width="1"/>
  <text x="940" y="437" font-family="DM Sans, sans-serif" font-size="11" fill="rgba(200,150,255,0.9)" text-anchor="middle" font-weight="600" letter-spacing="1">PWA</text>
  <rect x="992" y="420" width="130" height="26" rx="13" fill="rgba(200,169,110,0.12)" stroke="rgba(200,169,110,0.3)" stroke-width="1"/>
  <text x="1057" y="437" font-family="DM Sans, sans-serif" font-size="11" fill="rgba(200,169,110,0.9)" text-anchor="middle" font-weight="600" letter-spacing="1">FREE &amp; OPEN</text>

  <!-- Bottom tagline -->
  <text x="600" y="590" font-family="DM Sans, sans-serif" font-size="13" fill="rgba(255,255,255,0.2)" text-anchor="middle" letter-spacing="2">BUILT FOR TRAINERS · EDUCATORS · FACILITATORS</text>
</svg>
