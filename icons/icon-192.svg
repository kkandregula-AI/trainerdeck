<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1830"/>
      <stop offset="100%" style="stop-color:#0f0e17"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c8a96e"/>
      <stop offset="100%" style="stop-color:#e8c98e"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c6fcd"/>
      <stop offset="100%" style="stop-color:#9d8fe0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="200" height="200" rx="36" fill="url(#bg)"/>

  <!-- Presentation screen shape (D shape) -->
  <rect x="30" y="40" width="140" height="100" rx="10" fill="none" stroke="url(#purple)" stroke-width="5" opacity="0.4"/>

  <!-- Screen inner glow -->
  <rect x="35" y="45" width="130" height="90" rx="7" fill="rgba(124,111,205,0.06)"/>

  <!-- Reveal lines inside screen — the core mechanic -->
  <!-- Line 1: gold (current/active line) -->
  <rect x="50" y="65" width="100" height="7" rx="3.5" fill="url(#gold)"/>
  <!-- Gold left bar accent -->
  <rect x="47" y="63" width="3" height="11" rx="1.5" fill="url(#gold)"/>

  <!-- Line 2: revealed -->
  <rect x="50" y="83" width="85" height="6" rx="3" fill="rgba(255,255,255,0.65)"/>
  <!-- Line 3: revealed -->
  <rect x="50" y="99" width="95" height="6" rx="3" fill="rgba(255,255,255,0.65)"/>
  <!-- Line 4: not yet revealed (faded) -->
  <rect x="50" y="115" width="70" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>

  <!-- Podium/stand below screen -->
  <rect x="95" y="140" width="10" height="18" rx="2" fill="rgba(255,255,255,0.2)"/>
  <rect x="70" y="156" width="60" height="6" rx="3" fill="rgba(255,255,255,0.2)"/>

  <!-- TD Monogram bottom right — subtle brand stamp -->
  <text x="148" y="190" font-family="Georgia, serif" font-size="13" font-weight="700"
        fill="url(#gold)" opacity="0.7" letter-spacing="1">TD</text>
</svg>
